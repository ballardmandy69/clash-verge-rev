name: Build MandyVerge Windows 2.4.6

on:
  workflow_dispatch:
  push:
    branches:
      - my-2.4.6

permissions:
  contents: read

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: rust-windows-${{ env.TARGET }}
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Prebuild
        run: pnpm run prebuild $env:TARGET
        shell: pwsh

      - name: Build NSIS installer
        run: pnpm tauri build --target $env:TARGET -b nsis
        shell: pwsh
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Show final installer
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path "target/${{ env.TARGET }}/release/bundle/nsis" -ErrorAction SilentlyContinue
          Get-ChildItem -Path "src-tauri/target/${{ env.TARGET }}/release/bundle/nsis" -ErrorAction SilentlyContinue

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MandyVerge-windows-x64-2.4.6
          path: |
            target/${{ env.TARGET }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: error